server:
  port:
  servlet:
    context-path: /api


spring:
  profiles:
    active: dev
  jmx:
    enabled: false
  application:
    name: mental-health
  datasource:
    driver-class-name: org.postgresql.Driver
    url:
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
      mode: always
      mode: never
  servlet:
    multipart:
      enabled: true
      max-request-size: 10MB
      max-file-size: 10MB
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.xml
    user:
    password:
    url:
    driver-class-name: org.postgresql.Driver
    # Fast generate a differential changelog
    # https://www.baeldung.com/liquibase-refactor-schema-of-java-app#generate-the-changelog-in-intellij-idea-using-the-jpa-buddy-plugin
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            provider: google
            client-id:
            client-secret:
            redirect-uri:
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

secrets:
  jwt:
    EXPIRES_ACCESS_TOKEN_MINUTE:
    EXPIRES_REFRESH_TOKEN_MINUTE:
    ISSUER:
    KEY:

frontend:
  base-url:


logging:
  level:
    org.hibernate: info
    org.springframework: info
    org.springframework.security: debug