server:
  port:
  servlet:
    context-path: /api


spring:
  profiles:
    active: dev
  jmx:
    enabled: false
  application:
    name: mental-health
  datasource:
    driver-class-name: org.postgresql.Driver
    url:
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      database:
      port:
      host:
      username:
      password:
      timeout:
      client-type: lettuce

  servlet:
    multipart:
      enabled: true
      max-request-size: 10MB
      max-file-size: 10MB
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.xml
    user:
    password:
    url:
    driver-class-name: org.postgresql.Driver
    # Fast generate a differential changelog
    # https://www.baeldung.com/liquibase-refactor-schema-of-java-app#generate-the-changelog-in-intellij-idea-using-the-jpa-buddy-plugin
  security:
    oauth2:
      client:
        registration:
          vk:
            client-name: VK
            client-id:
            client-secret:
            redirect-uri:
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: email
            provider: vk
          google:
            provider: google
            client-id:
            client-secret:
            redirect-uri:
            scope:
              - email
              - profile
        provider:
          vk:
            authorization-uri: https://oauth.vk.com/authorize?revoke=1
            token-uri: https://oauth.vk.com/access_token
            user-info-uri: https://api.vk.com/method/users.get?v=5.131&fields=photo_max,email
            user-name-attribute: response
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
  mail:
    host:
    port:
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true

secrets:
  jwt:
    EXPIRES_ACCESS_TOKEN_MINUTE:
    EXPIRES_REFRESH_TOKEN_MINUTE:
    ISSUER:
    KEY:

frontend:
  base-url:


logging:
  level:
    org.hibernate: info
    org.springframework: info
    org.springframework.security: debug